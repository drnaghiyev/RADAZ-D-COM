name: Publish RADAZ Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radaz-windows-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Check whether this version needs publishing
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/github-release.py plan
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.plan.outputs.publish == 'true'
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        if: steps.plan.outputs.publish == 'true'
        shell: pwsh
        run: |
          npm install --global pnpm@11.25.0 --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install 'Pillow>=10,<13'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check types and protocols
        if: steps.plan.outputs.publish == 'true'
        shell: pwsh
        run: |
          node node_modules/typescript/bin/tsc --noEmit --incremental false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/*.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p '*_test.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and validate the Windows package
        if: steps.plan.outputs.publish == 'true'
        shell: pwsh
        run: |
          node scripts/run-framework.mjs build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/startup-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/launcher-update.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package-release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package-desktop.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/desktop-install-smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/github-release.py validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.plan.outputs.publish == 'true'
        with:
          name: windows-release-${{ steps.plan.outputs.version }}
          path: |
            outputs/releases/*.zip
            outputs/releases/*.exe
            outputs/releases/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release-${{ needs.build.outputs.version }}
          path: outputs/releases
      - name: Publish verified assets and make the release visible to RADAZ
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/github-release.py publish
